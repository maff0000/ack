# Copy to an ignored project-local runtime config and supply real values externally.
redis_url: ${ACK_REDIS_URL}
heartbeat_seconds: 20
lease_seconds: 60
degraded_seconds: 45
stale_seconds: 90
max_parallel_agents: 4

# ACK constructs and validates the confinement arguments; only the executable is configurable.
sandbox_executable: bwrap

# Add only the provider/authentication variables deliberately required locally.
agent_env_allowlist:
  - PATH
  - HOME
  - CODEX_HOME
  - LANG
  - LC_ALL
  - TERM
  - SSL_CERT_FILE
  - SSL_CERT_DIR
  - ACK_LITELLM_URL
  - ACK_API_KEY

# argv only; ACK never invokes this through a shell. Placeholders are substituted.
# Configure Codex/LiteLLM authentication and provider routing outside ACK.
agent_command:
  - codex
  - exec
  - -C
  - "{project_root}"
  - -m
  - "{model}"
  - --sandbox
  - "{sandbox_mode}"
  - --output-schema
  - "{result_schema}"
  - "Read the supplied context, perform only the assigned task, report meaningful progress with ack-agent, and return only the required YAML result."
